name: Fix delete modal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch delete modal and remove legacy fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          product_path = Path('src/admin/ProductManager.jsx')
          text = product_path.read_text()

          old = '''              <button\n                onClick={() => {\n                  deleteProduct(deleteConfirmationId)\n                  setDeleteConfirmationId(null)\n                  showToast('Product deleted.')\n                }}\n                className="rounded-lg bg-red-600 px-4 py-2 text-xs font-semibold text-white hover:bg-red-700 shadow-xs"\n              >'''

          new = '''              <button\n                type="button"\n                onClick={(event) => {\n                  event.preventDefault()\n                  event.stopPropagation()\n\n                  const productId = deleteConfirmationId\n                  setDeleteConfirmationId(null)\n\n                  try {\n                    deleteProduct(productId)\n                    showToast('Product deleted.')\n                  } catch (error) {\n                    console.error('Delete product error:', error)\n                    showToast('Unable to delete the product.', 'error')\n                  }\n                }}\n                className="rounded-lg bg-red-600 px-4 py-2 text-xs font-semibold text-white hover:bg-red-700 shadow-xs"\n              >'''

          if old not in text:
              raise SystemExit('Expected delete button block was not found; refusing to modify the file.')

          product_path.write_text(text.replace(old, new, 1))

          index_path = Path('index.html')
          index = index_path.read_text()
          index = index.replace('    <!-- Compatibility fallback for the legacy reset banner reference in AdminDashboard. -->\n    <script>var resetSuccessNotice = false;</script>\n', '')
          index_path.write_text(index)
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-delete-modal.yml
          git add src/admin/ProductManager.jsx index.html .github/workflows/fix-delete-modal.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: close product delete modal reliably"
          git push origin main
