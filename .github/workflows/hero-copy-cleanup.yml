name: Clean Hero Copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace hero description with concise brand line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/Hero.jsx')
          text = path.read_text()

          old = '''                Connecting quality brands with growing markets.\n                <span className="hidden sm:inline">\n                  {' '}\n                  Creating long-term partnerships through\n                  distribution, trust and scale.\n                </span>'''

          new = '''                Connecting Quality · Creating Markets · Growing Together'''

          if old not in text:
              raise SystemExit('Expected hero copy was not found; no changes made.')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit hero cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Hero.jsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor: simplify hero copy"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/hero-copy-cleanup.yml || true
          git commit -m "chore: remove temporary hero cleanup workflow" || true
          git push || true
